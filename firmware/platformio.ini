[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = 
    pre:tools/build_sprites.py
    pre:tools/build_scenes.py

upload_protocol = espota
upload_port = kubi.local

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; Audio out of the ESP32's own DAC (GPIO 25 L, 26 R) into a PAM8403 amp.
    ; Remove for a MAX98357A I2S amp (BCLK 26, LRC 25, DIN 27). AudioManager.cpp
    -D KUBI_AUDIO_INTERNAL_DAC

; Exact versions: each environment installs its own copy of these, and with
; ^ ranges esp32dev_usb (installed later) got ESPAsyncWebServer 3.12.1 and
; AsyncTCP 3.5.0 while esp32dev had 3.10.3 / 3.4.10, so what ran on the cube
; depended on how it was flashed. AsyncTCP and BusIO are pulled in by others;
; listing them pins them too. Bump deliberately and re-test on hardware.
lib_deps =
    SPI
    Wire
    LittleFS
    tzapu/WiFiManager @ 2.0.17
    esp32async/ESPAsyncWebServer @ 3.10.3
    esp32async/AsyncTCP @ 3.4.10
    bblanchon/ArduinoJson @ 7.4.3
    bodmer/TFT_eSPI @ 2.5.43
    adafruit/Adafruit ADXL345 @ 1.3.4
    adafruit/Adafruit BMP280 Library @ 2.6.8
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4
    earlephilhower/ESP8266Audio @ 1.9.9

; Same build, flashed over the USB cable instead of WiFi. Needed for the first
; flash of a blank board. The port is auto-detected; add --upload-port COMx if
; more than one serial device is plugged in.
;   pio run -e esp32dev_usb -t upload
;   pio run -e esp32dev_usb -t uploadfs
[env:esp32dev_usb]
extends = env:esp32dev
upload_protocol = esptool
upload_port =